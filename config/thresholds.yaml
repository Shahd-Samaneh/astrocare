# Clinical / data-quality thresholds used by the rule engine (server/rules/).
# RULE: every threshold needs a `source`. If you don't have one yet, write
# "TODO" and say so in `note`. Never invent a number for the demo.
#
# Each entry: value, unit, source, note.

stale_minutes:
  value: 120
  unit: min
  source: "Team decision (data quality), not clinical"
  note: "A continuous metric with no reading for longer than this is flagged as stale."

hr_sd_multiplier:
  value: 2
  unit: SD
  source: "Team decision: personal baseline mean ± k·SD"
  note: "Heart rate outside baseline mean ± k·SD is flagged for review."

hr_consecutive_readings:
  value: 3
  unit: readings
  source: "Full Plan §9 (team decision)"
  note: "Number of consecutive good-quality HR readings that must all be above baseline to flag R-HR-01."

spo2_min:
  value: 92
  unit: "%"
  source: "TODO"
  note: "verify source (commonly cited lower bound for healthy adults; confirm against a NASA/clinical reference)."

sleep_short_hours:
  value: 6
  unit: h
  source: "TODO: NASA sleep/fatigue guidance"
  note: "Nights shorter than this count as short sleep."

attention_slower_pct:
  value: 15
  unit: "%"
  source: "Team decision; compare with PVT literature"
  note: "Attention-test median slower than personal baseline by more than this percentage."

pvt_lapse_ms:
  value: 500
  unit: ms
  source: "Psychomotor Vigilance Test convention (lapse = RT > 500 ms)"
  note: "Reaction times above this count as lapses."

co2_max:
  value: 3
  unit: mmHg
  source: "NASA-STD-3001 Vol. 2 [V2 6004], via NASA OCHMO Technical Brief TB-004 Carbon Dioxide"
  note: "Limit on the 1-hour average ppCO2 in the habitable volume. https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-004-carbon-dioxide.pdf"

co2_avg_window_minutes:
  value: 60
  unit: min
  source: "NASA-STD-3001 Vol. 2 [V2 6004] (1-hour average)"
  note: "Window over which cabin co2 is averaged before comparing with co2_max."

cabin_temp_min:
  value: 20
  unit: "°C"
  source: "NASA-STD-3001 Vol. 2 [V2 6013] Crew Performance Environmental Zone, via NASA OCHMO TB-002 ECLSS"
  note: "Lower bound of the usual cabin temperature range."

cabin_temp_max:
  value: 25
  unit: "°C"
  source: "NASA-STD-3001 Vol. 2 [V2 6013] Crew Performance Environmental Zone, via NASA OCHMO TB-002 ECLSS"
  note: "Upper bound of the usual cabin temperature range."

humidity_min:
  value: 30
  unit: "%"
  source: "NASA-STD-3001 Vol. 2 [V2 6013] Crew Performance Environmental Zone, via NASA OCHMO TB-002 ECLSS"
  note: "Lower bound of the usual cabin relative-humidity range."

humidity_max:
  value: 60
  unit: "%"
  source: "NASA-STD-3001 Vol. 2 [V2 6013] Crew Performance Environmental Zone, via NASA OCHMO TB-002 ECLSS"
  note: "Upper bound of the usual cabin relative-humidity range."

noise_sd_multiplier:
  value: 2
  unit: SD
  source: "Team decision (no NASA noise limit in this source)"
  note: "Cabin noise outside baseline mean ± k·SD of the last noise_baseline_days is flagged."

noise_baseline_days:
  value: 7
  unit: d
  source: "Team decision"
  note: "Look-back window for the cabin noise baseline (mean and SD)."
